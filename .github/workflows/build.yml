name: Build Bonelab Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore FacePixelator.csproj

    - name: Compile Mod DLL
      run: dotnet build FacePixelator.csproj -c Release

    - name: Upload Finished Mod
      uses: actions/upload-artifact@v4
      with:
        name: FacePixelator-Mod
        path: bin/Release/net472/FacePixelator.dll
